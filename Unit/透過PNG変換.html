<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>透過PNG変換</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--card:#fff;--line:#d9d6cf;--ac:#2f6f5e;--acfg:#fff;--mut:#6b6a64;--c1:#fff;--c2:#d8d8d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ecebe6;--card:#232321;--line:#3a3a36;--ac:#6fc2a8;--acfg:#10201b;--mut:#a09f97;--c1:#3a3a3a;--c2:#2c2c2c}}
:root[data-theme="dark"]{--bg:#171716;--fg:#ecebe6;--card:#232321;--line:#3a3a36;--ac:#6fc2a8;--acfg:#10201b;--mut:#a09f97;--c1:#3a3a3a;--c2:#2c2c2c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 16px;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:28px 12px;text-align:center;cursor:pointer}
.drop.on{border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.chk{background-color:var(--c1);background-image:linear-gradient(45deg,var(--c2) 25%,transparent 25%,transparent 75%,var(--c2) 75%),linear-gradient(45deg,var(--c2) 25%,transparent 25%,transparent 75%,var(--c2) 75%);background-size:16px 16px;background-position:0 0,8px 8px;border-radius:8px;overflow:hidden;text-align:center;line-height:0}
canvas,#res{max-width:100%;height:auto;cursor:crosshair}
#res{cursor:auto}
label{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}
input[type=range]{width:100%}
select,button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600;width:100%;margin-top:14px}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
#sw{width:28px;height:28px;border-radius:6px;border:1px solid var(--line)}
[hidden]{display:none!important}
.bgs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px}
.bgs button{padding:6px 12px;font-size:13px}
.bgs button.on{border-color:var(--ac);outline:2px solid var(--ac)}
</style></head><body><main>
<h1>透過PNG変換</h1>
<p class="s">背景の「色」を指定して透明にします。画像はこの端末内で処理され、送信されません。</p>
<div class="drop" id="drop">画像を選択・ドロップ・貼り付け<input id="file" type="file" accept="image/*" hidden></div>
<div id="work" hidden>
  <div class="card">
    <div class="chk"><canvas id="cv"></canvas></div>
    <div class="bgs"><span>プレビュー背景</span>
      <button class="on" data-c="">チェック</button><button data-c="#ffffff">白</button><button data-c="#000000">黒</button><button data-c="#00b050">緑</button><button data-c="#ffe600">黄</button></div>
    <div class="row"><span id="sw"></span><span>画像をタップすると、その場所の色を透明にします</span></div>
    <div class="row"><span>範囲</span>
      <select id="mode"><option value="flood">つながった領域のみ(被写体の中を残す)</option><option value="all">画像全体の同じ色</option></select></div>
    <label><span>色の許容範囲</span><span id="tv">30</span></label><input id="tol" type="range" min="0" max="200" value="30">
    <label><span>縁のなめらかさ</span><span id="fv">20</span></label><input id="fe" type="range" min="0" max="100" value="20">
    <button class="p" id="go">PNGを書き出す</button>
  </div>
  <div class="card" id="out" hidden>
    <div class="chk"><img id="res" alt="透過PNG"></div>
    <p class="s" style="margin:10px 0 0">保存できない場合は、画像を長押し(PC は右クリック)して保存してください。</p>
    <div class="bgs"><button id="again">この結果をさらに編集</button><button id="reset">元画像に戻す</button></div>
  </div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
let img=null,orig=null,last=null,seed=[0,0],key=[255,255,255],raf=0,url='';
const clone=d=>new ImageData(new Uint8ClampedArray(d.data),d.width,d.height);
const drop=$('#drop'),file=$('#file');
drop.onclick=()=>file.click();
file.onchange=()=>load(file.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');load(e.dataTransfer.files[0])};
addEventListener('paste',e=>{const f=[...e.clipboardData.files][0];if(f)load(f)});
function load(f){
  if(!f||!f.type.startsWith('image/'))return;
  const im=new Image();
  im.onload=()=>{
    cv.width=im.naturalWidth;cv.height=im.naturalHeight;
    ctx.drawImage(im,0,0);
    img=ctx.getImageData(0,0,cv.width,cv.height);orig=clone(img);
    $('#work').hidden=false;$('#out').hidden=true;
    pick(0,0);
    URL.revokeObjectURL(im.src);
  };
  im.src=URL.createObjectURL(f);
}
function pick(x,y){
  seed=[x,y];const i=(y*cv.width+x)*4,d=img.data;
  key=[d[i],d[i+1],d[i+2]];
  $('#sw').style.background=`rgb(${key})`;
  schedule();
}
cv.addEventListener('click',e=>{
  if(!img)return;
  const r=cv.getBoundingClientRect();
  const x=Math.min(cv.width-1,Math.max(0,Math.floor((e.clientX-r.left)*cv.width/r.width)));
  const y=Math.min(cv.height-1,Math.max(0,Math.floor((e.clientY-r.top)*cv.height/r.height)));
  pick(x,y);
});
['tol','fe','mode'].forEach(id=>$('#'+id).addEventListener('input',()=>{
  $('#tv').textContent=$('#tol').value;$('#fv').textContent=$('#fe').value;schedule();
}));
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(run)}
function run(){
  const w=cv.width,h=cv.height,s=img.data,out=new ImageData(new Uint8ClampedArray(s),w,h),o=out.data;
  const tol=+$('#tol').value,fe=+$('#fe').value,th=tol+fe,all=$('#mode').value==='all';
  const dist=i=>Math.hypot(s[i]-key[0],s[i+1]-key[1],s[i+2]-key[2]);
  const apply=(i,d)=>{o[i+3]=(d<=tol||fe<=0)?0:Math.round(s[i+3]*Math.min(1,(d-tol)/fe))};
  if(all){
    for(let p=0;p<w*h;p++){const i=p*4,d=dist(i);if(d<=th)apply(i,d)}
  }else{
    const seen=new Uint8Array(w*h),st=new Int32Array(w*h);let n=0;
    const start=seed[1]*w+seed[0];st[n++]=start;seen[start]=1;
    while(n){
      const p=st[--n],i=p*4,d=dist(i);
      if(d>th)continue;
      apply(i,d);
      if(d>tol)continue; // 縁(半透明)の先には広げない
      const x=p%w;
      if(x>0&&!seen[p-1]){seen[p-1]=1;st[n++]=p-1}
      if(x<w-1&&!seen[p+1]){seen[p+1]=1;st[n++]=p+1}
      if(p>=w&&!seen[p-w]){seen[p-w]=1;st[n++]=p-w}
      if(p<w*h-w&&!seen[p+w]){seen[p+w]=1;st[n++]=p+w}
    }
  }
  ctx.putImageData(out,0,0);last=out;
}
document.querySelectorAll('.bgs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.bgs button').forEach(x=>x.classList.toggle('on',x===b));
  const c=b.dataset.c;
  document.querySelectorAll('.chk').forEach(e=>{e.style.backgroundImage=c?'none':'';e.style.backgroundColor=c||''});
});
$('#again').onclick=()=>{if(!last)return;img=clone(last);run();cv.scrollIntoView({behavior:'smooth',block:'center'})};
$('#reset').onclick=()=>{if(!orig)return;img=clone(orig);pick(seed[0],seed[1]);cv.scrollIntoView({behavior:'smooth',block:'center'})};
$('#go').onclick=()=>{
  cv.toBlob(b=>{
    if(url)URL.revokeObjectURL(url);
    url=URL.createObjectURL(b);
    $('#res').src=url;$('#out').hidden=false;
    $('#out').scrollIntoView({behavior:'smooth'});
    try{const a=document.createElement('a');a.href=url;a.download='transparent.png';a.click()}catch(e){}
  },'image/png');
};
</script></body></html>
