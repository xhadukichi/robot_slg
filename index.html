<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot＿SLG（仮）</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <button id="audio-start-screen" class="audio-start-screen" type="button">Please click to Game Start</button>
    <section id="title-screen" class="title-screen" aria-label="タイトル画面">
      <img class="title-background" src="Unit/Title_back.png" alt="" />
      <div class="title-shade" aria-hidden="true"></div>
      <div class="title-menu">
        <h1>Ｒｏｂｏｔ＿ＳＬＧ（仮）</h1>
        <div class="title-options" role="menu" aria-label="タイトルメニュー">
          <button type="button" data-title-action="new" role="menuitem">Ｎｅｗ　Ｇａｍｅ</button>
          <button type="button" data-title-action="load" role="menuitem" aria-disabled="true">Ｌｏａｄ　Ｇａｍｅ</button>
        </div>
      </div>
    </section>
    <section id="intro-event" class="intro-event" aria-label="ステージ前イベント" hidden>
      <img src="Unit/Event_01.png" alt="イベント挿絵" />
      <div class="story-window">
        <div id="story-speaker" class="story-speaker"></div>
        <div id="story-text" class="story-text" aria-live="polite"></div>
        <button id="story-skip" class="story-skip" type="button">《SKIP》</button>
        <button id="story-start" class="story-start" type="button" disabled>《Game Start》</button>
      </div>
    </section>
    <main class="game-shell" hidden>
      <header class="game-header">
        <div>
          <p class="eyebrow">ROBOT SLG / PROTOTYPE</p>
      <h1>Robot＿SLG（仮）</h1>
        </div>
        <p class="help">クリック / Space・Enter・X：決定　Esc・Z：キャンセル</p>
      </header>
      <section class="map-frame" aria-label="横20マス、縦16マスのマップ">
        <canvas id="map" width="1024" height="768" tabindex="0" aria-label="マップ。矢印キーまたはWASDでカーソルを移動できます"></canvas>
        <div id="passability-legend" class="passability-legend" hidden>
          <span><i class="passability-swatch passable"></i>侵入可能</span>
          <span><i class="passability-swatch impassable"></i>侵入不可</span>
        </div>
        <div id="map-scrollbar-x" class="map-scrollbar map-scrollbar-x" role="scrollbar" aria-label="マップの左右スクロール" aria-orientation="horizontal" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" tabindex="0"><span></span></div>
        <div id="map-scrollbar-y" class="map-scrollbar map-scrollbar-y" role="scrollbar" aria-label="マップの上下スクロール" aria-orientation="vertical" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" tabindex="0"><span></span></div>
        <div id="unit-command" class="unit-command" hidden>
          <button type="button" data-action="move">移動</button>
          <button type="button" data-action="attack">攻撃</button>
          <button type="button" data-action="status">ステータス</button>
          <button type="button" data-action="end">行動終了</button>
        </div>
        <div id="attack-choice-command" class="unit-command" hidden>
          <button type="button" data-action="normal-attack">通常攻撃</button>
          <button type="button" data-action="precision-attack">精密攻撃</button>
          <button type="button" data-action="hate">ヘイト</button>
        </div>
        <div id="precision-confirm-command" class="unit-command precision-confirm-command" hidden>
          <div class="precision-confirm-message">移動を捨てて命中精度を向上させます</div>
          <button type="button" data-action="confirm-precision">はい</button>
          <button type="button" data-action="cancel-precision">キャンセル</button>
        </div>
        <div id="hate-confirm-command" class="unit-command precision-confirm-command" hidden>
          <div class="precision-confirm-message">敵の注意を自分にひきつけますか？</div>
          <button type="button" data-action="confirm-hate">はい</button>
          <button type="button" data-action="cancel-hate">キャンセル</button>
        </div>
        <div id="move-confirm-command" class="unit-command move-confirm-command" hidden>
          <button type="button" data-action="commit-move" class="selected">決定</button>
          <button type="button" data-action="cancel-move">キャンセル</button>
        </div>
        <div id="unit-status" class="unit-status" hidden></div>
        <section id="debug-panel" class="debug-panel" role="dialog" aria-modal="true" aria-labelledby="debug-title" hidden>
          <h2 id="debug-title" class="debug-panel-drag-handle">デバッグモード <span>ドラッグして移動</span></h2>
          <label>ユニット<select id="debug-unit"></select></label>
          <label>現在HP<input name="hp" type="number" step="1"></label>
          <label>移動力<input name="moveRange" type="number" step="1"></label>
          <label>回避値<input name="evasion" type="number" step="1"></label>
          <label>命中補正<input name="hitBonus" type="number" step="1"></label>
          <label>射程<input name="attackRange" type="number" step="1"></label>
          <label>攻撃力<input name="attackPower" type="number" step="1"></label>
          <div class="debug-actions"><button type="button" data-debug-action="apply">反映</button><button type="button" data-debug-action="cancel">キャンセル</button></div>
          <p>Ctrl+Q で閉じる</p>
        </section>
        <div id="empty-command" class="unit-command empty-command" hidden>
          <button type="button" data-action="confirm-turn">ターン終了</button>
        </div>
        <div id="attack-message" class="attack-message" role="status" aria-live="polite" hidden>Atack!</div>
        <div id="phase-announcement" class="phase-announcement" role="status" aria-live="polite" hidden></div>
        <div id="game-result" class="game-result" role="alert" aria-live="assertive" hidden>
          <div id="game-result-message" class="game-result-message"></div>
          <div id="game-over-options" class="game-over-options" hidden>
            <button type="button" data-game-over-action="retry">Try Again</button>
            <button type="button" data-game-over-action="load" disabled>Load Data</button>
            <button type="button" data-game-over-action="top">Turn to Top Menu</button>
          </div>
        </div>
        <div id="turn-confirm" class="turn-confirm" role="dialog" aria-modal="true" hidden>
          <p>ターン終了を宣言しますか？</p>
          <div>
            <button type="button" data-choice="yes">はい</button>
            <button type="button" data-choice="no">いいえ</button>
          </div>
        </div>
      </section>
      <div id="touch-controls" class="touch-controls" hidden>
        <button id="cancel-action" type="button">キャンセル / 戻る</button>
      </div>
      <footer class="status" aria-live="polite">
        <span>カーソル</span>
        <strong id="coordinates">X 1, Y 1</strong>
        <strong id="phase-label">第1ターン・PCフェイズ</strong>
        <span class="map-size">MAP 20 × 16 · VIEW 16 × 12</span>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
